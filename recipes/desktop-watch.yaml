name: desktop-watch
description: |
  Headful Linux microVM with XFCE + Chromium. Operator watches the
  desktop live over KasmVNC. Use for research, QA, click-through —
  any task where SEEING the page is the point.

  This recipe matches Karkhana's pre-v0.7 default behaviour. New
  deployments should consider headless-dev for code-shaped tasks
  and mixed for exploratory work.

image: kk-base

resources:
  cpu: 2
  memory_mb: 4096
  timeout_secs: 1800

# Bhatti secrets to inject as env vars at sandbox boot. The
# worker pi process needs ONE of the LLM-provider keys to
# authenticate; list all the common ones here and bhatti only
# injects the names that are actually set on the host. The
# karkhana startup validator warns about any that are missing
# but does not block boot — you can run with just one provider.
#
# Set whichever your pi config uses, once per host:
#   bhatti secret set OPENROUTER_API_KEY  <value>
#   bhatti secret set ANTHROPIC_API_KEY   <value>
#   bhatti secret set OPENAI_API_KEY      <value>
#   bhatti secret set GOOGLE_API_KEY      <value>
secrets:
  - OPENROUTER_API_KEY
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - GOOGLE_API_KEY

# Pi extension paths, interpreted INSIDE the sandbox filesystem.
# scripts/bake-image.sh installs the computer-use extension at
# this path.
extensions:
  - /usr/local/share/karkhana/extensions/computer-use/index.ts

prompt: worker.desktop-watch

# Network policy. Today these are documented but not yet enforced
# at the substrate level — the curl regex block in
# computer-use/index.ts is recipe-agnostic. Enforcement lands in
# a follow-up; declared now so recipes that need it can.
allow_http:
  - "*"
deny_curl_to_others: true

canvas:
  primary_tile: desktop
  show_published_urls: false
